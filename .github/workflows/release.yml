   name: Build and release APK

   on:
     push:
       branches: [main]
     workflow_dispatch:

   permissions:
     contents: write

   jobs:
     release:
       runs-on: ubuntu-latest
       steps:
         - uses: actions/checkout@v4

         - uses: actions/setup-java@v4
           with:
             distribution: temurin
             java-version: 17

         - uses: gradle/actions/setup-gradle@v4
           with:
             gradle-version: 8.9

         - name: Build debug APK
           run: gradle assembleDebug --no-daemon

         - name: Name the APK
           run: cp app/build/outputs/apk/debug/app-debug.apk DailyTodo-v${{ github.run_number }}.apk

         - name: Publish GitHub Release
           run: |
             gh release create "v${{ github.run_number }}" \
               "DailyTodo-v${{ github.run_number }}.apk" \
               --title "Daily Todo v${{ github.run_number }}" \
               --generate-notes
           env:
             GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
